version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thrifty
      POSTGRES_PASSWORD: thrifty
      POSTGRES_DB: thrifty
    ports:
      - "5432:5432"
    volumes:
      - thrifty_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - thrifty_redis_data:/data

volumes:
  thrifty_postgres_data:
  thrifty_redis_data:
